{{if .Body}}<section class="listing-intro">
{{.Body}}</section>
{{end}}<h1>{{.ListingHeading}}</h1>
<ul class="post-list">
{{range .Posts}}  <li>{{if .FeaturedImage}}<a class="featured-image" href="{{.Slug}}/"><img src="{{.FeaturedImage}}" alt=""></a>{{end}}<time datetime="{{.Date}}">{{.Date}}</time> <a href="{{.Slug}}/">{{.Title}}</a></li>
{{end}}</ul>
